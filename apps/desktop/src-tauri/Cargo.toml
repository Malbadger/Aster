[package]
name = "law-desktop"
version = "0.1.0"
description = "Aster — Local Agent Workbench desktop shell"
authors = ["Aster contributors"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[lib]
name = "law_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Production build has no custom protocol dev conveniences.
custom-protocol = ["tauri/custom-protocol"]
